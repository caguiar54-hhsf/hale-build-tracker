<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hale Build">
<meta name="description" content="Track a house build together: schedule, budget, selections, site log and paperwork.">
<title>Hale Build Tracker</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>

<!-- sign in -->
<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="brand"><img src="/icon.svg" alt="" width="40" height="40"><span>Hale Build</span></div>
    <h1 id="authTitle">Sign in</h1>
    <p class="hint" id="authSub">Track your house build together: schedule, budget, selections and paperwork.</p>
    <form id="authForm" novalidate>
      <label class="field" for="authName" id="nameRow" hidden><span class="label">Your name</span><input id="authName" autocomplete="name" placeholder="e.g. Kalani"></label>
      <label class="field" for="authEmail"><span class="label">Email</span><input id="authEmail" type="email" autocomplete="email" inputmode="email" required></label>
      <label class="field" for="authPass" id="passRow"><span class="label">Password</span><input id="authPass" type="password" autocomplete="current-password" minlength="8" required></label>
      <div class="err" id="authErr" hidden></div>
      <div class="ok" id="authOk" hidden></div>
      <button class="btn primary wide" type="submit" id="authBtn">Sign in</button>
    </form>
    <div class="auth-links">
      <button class="btn-link" type="button" id="toSignup">New here? Create an account</button>
      <button class="btn-link" type="button" id="toForgot">Forgot password?</button>
      <button class="btn-link" type="button" id="toSignin" hidden>Have an account? Sign in</button>
    </div>
  </div>
</section>

<!-- pick or create a build -->
<section id="picker" class="auth" hidden>
  <div class="auth-card">
    <div class="brand"><img src="/icon.svg" alt="" width="40" height="40"><span>Hale Build</span></div>
    <h1>Your builds</h1>
    <div id="pickList" class="pick-list"></div>
    <p class="hint" id="pickHint"></p>
    <form id="newProject" class="new-project" novalidate>
      <label class="field" for="npName"><span class="label">Start a new build</span><input id="npName" placeholder="e.g. The Kealoha house"></label>
      <button class="btn primary" type="submit">Create</button>
    </form>
    <div class="err" id="pickErr" hidden></div>
    <div class="auth-links"><span class="hint" id="pickWho"></span><button class="btn-link" type="button" data-signout>Sign out</button></div>
  </div>
</section>

<!-- the app -->
<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <button class="proj-switch" id="switchProject" type="button" title="Switch build"><img src="/icon.svg" alt="" width="22" height="22"><span>Hale Build</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>
      <div class="acct"><span id="whoami"></span><button class="btn-link" type="button" data-signout>Sign out</button></div>
    </div>
    <div class="title-row">
      <div>
        <h1 id="pname">House build</h1>
        <div class="addr" id="paddr">Hilo, Hawaiʻi</div>
      </div>
      <button class="btn-link write" id="editProject" type="button">Edit project details</button>
    </div>
    <div class="vitals num" id="vitals"></div>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <nav class="tabs" id="tabs">
      <a href="#overview" data-g="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#phases" data-g="schedule"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h3M7 17h6"/></svg><span>Schedule</span></a>
      <a href="#budget" data-g="money"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg><span>Money</span></a>
      <a href="#selections" data-g="selections"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span>Selections</span></a>
      <a href="#log" data-g="site"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20h20M5 20V9l7-5 7 5v11"/><path d="M10 20v-6h4v6"/></svg><span>Site</span></a>
      <a href="#documents" data-g="files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Files</span></a>
    </nav>
  </div>
</header>

<main><div class="wrap">
  <div class="notice" id="notice" hidden></div>
  <section id="view"></section>
</div></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="splash" id="splash"><img src="/icon.svg" alt="" width="48" height="48"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
